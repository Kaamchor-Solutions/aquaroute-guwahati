name = "aquaroute-jorhat"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]
IP_SALT = "aquaroute-jorhat-salt-change-me"

[[d1_databases]]
binding = "DB"
database_name = "aquaroute-reports"
database_id = "YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "aquaroute-photos"
